{{/* "Cụm từ thường gặp" — docs/plan.md §1.3. 2-3 cụm/từ, không có ca 4 (§2.3). */}}
{{ $w := . }}
<section class="detail-section">
  <p class="section-label">Cụm từ thường gặp</p>
  <div class="word-collocations">
    {{ range $w.collocations }}
      <div class="word-collocations__row">
        <div class="word-collocations__en">
          <span>{{ .en }}</span>
          <button type="button" class="speak-button" data-speak="{{ .en }}" aria-label="Nghe phát âm {{ .en }}">
            {{ partial "icons/icon.html" (dict "name" "speaker") }}
          </button>
        </div>
        <p class="word-collocations__vi">{{ .vi }}</p>
      </div>
    {{ end }}
  </div>
</section>
