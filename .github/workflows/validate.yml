name: Validate data & build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo CLI (extended)
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml yamllint

      - name: yamllint data/**/*.yaml
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, \
            braces: {min-spaces-inside: 0, max-spaces-inside: 1}, indentation: {indent-sequences: whatever}, \
            empty-lines: {max-end: 1}}}" data/words data/exercises data/taxonomy.yaml

      - name: Validate data consistency
        run: python3 scripts/validate_data.py

      - name: Hugo build (strict)
        run: hugo --gc --minify --panicOnWarning --baseURL "https://ndchungict.github.io/toeic-vocab/"
