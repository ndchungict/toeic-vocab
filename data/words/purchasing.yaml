  note: "Anh-Anh viết là 'catalogue', Anh-Mỹ viết 'catalog' — hai cách viết của cùng một từ."

- word: "merchandise"
  pos: "noun"
  ipa: "/ˈmɜːtʃəndaɪz/"
  meaning: "hàng hóa (nói chung)"
  topic: "purchasing"
  sub-topic: "ordering"
  lesson: ["lesson-15"]
  level: 750
  forms:
    noun: ["merchandise", "merchandising"]
    verb: "merchandise"
  collocations:
    - en: "display the merchandise"
      vi: "trưng bày hàng hóa"
    - en: "return unsold merchandise"
      vi: "trả lại hàng chưa bán được"
  example:
    en: "Each order form lists the {merchandise} and the quantity requested."
    vi: "Mỗi phiếu đặt hàng liệt kê hàng hóa và số lượng yêu cầu."
  note: "Danh từ KHÔNG đếm được: không có 'merchandises', không dùng 'a merchandise'. Muốn đếm thì nói 'items of merchandise'."

- word: "inventory"
