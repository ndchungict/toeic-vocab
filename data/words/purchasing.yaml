  note: "Đi với giới từ 'by': send sth by courier (không có mạo từ)."

- word: "expedite"
  pos: "verb"
  ipa: "/ˈekspədaɪt/"
  meaning: "đẩy nhanh, xúc tiến cho nhanh hơn"
  topic: "purchasing"
  sub-topic: "shipping"
  lesson: ["lesson-16"]
  level: 750
  forms:
    verb: "expedite"
    adjective: "expedited"
  collocations:
    - en: "expedite the shipping"
      vi: "đẩy nhanh việc vận chuyển"
    - en: "expedite the approval process"
      vi: "đẩy nhanh quy trình phê duyệt"
  example:
    en: "They paid an extra fee to {expedite} the delivery of the chips."
    vi: "Họ đã trả thêm phí để đẩy nhanh việc giao số vi mạch."
  note: "Từ rất hay ra Part 5/6, thường đi với shipment / delivery / order / process. Đồng nghĩa: 'speed up', 'accelerate'."

- word: "shipping and handling"
  pos: "noun"
  ipa: "/ˈʃɪpɪŋ ənd ˈhændlɪŋ/"
  meaning: "phí vận chuyển và xử lý đơn hàng"
  topic: "purchasing"
  sub-topic: "shipping"
  lesson: ["lesson-16"]
  level: 750
  forms:
    noun: "shipping and handling"
    verb: ["ship", "handle"]
  collocations:
    - en: "cover shipping and handling"
      vi: "chi trả phí vận chuyển và xử lý"
    - en: "shipping and handling charges"
      vi: "các khoản phí vận chuyển và xử lý"
  example:
    en: "{Shipping and handling} was listed separately at the bottom of the bill."
    vi: "Phí vận chuyển và xử lý được ghi riêng ở cuối hóa đơn."
  note: "Luôn đi thành một cụm cố định và coi như danh từ số ít khi chia động từ."

- word: "surcharge"
  pos: "noun"
  ipa: "/ˈsɜːtʃɑːdʒ/"
  meaning: "phụ phí, khoản phí thu thêm"
  topic: "purchasing"
  sub-topic: "shipping"
  lesson: ["lesson-16"]
  level: 750
  forms:
    noun: "surcharge"
    verb: "surcharge"
  collocations:
    - en: "a delivery surcharge"
      vi: "phụ phí giao hàng"
    - en: "a fuel surcharge"
      vi: "phụ phí nhiên liệu"
  example:
    en: "A small {surcharge} applies to all rush delivery requests."
    vi: "Một khoản phụ phí nhỏ được áp dụng cho mọi yêu cầu giao hàng gấp."
  note: "Tiền tố 'sur-' nghĩa là 'thêm vào'. Đừng nhầm với 'discount' (giảm giá) hay 'refund' (hoàn tiền)."

- word: "fragile"
  pos: "adjective"
  ipa: "/ˈfrædʒaɪl/"
  meaning: "dễ vỡ, mong manh"
  topic: "purchasing"
  sub-topic: "shipping"
  lesson: ["lesson-16"]
  level: 750
  forms:
    adjective: "fragile"
    noun: "fragility"
  collocations:
    - en: "fragile items"
      vi: "các mặt hàng dễ vỡ"
    - en: "handle with care — fragile"
      vi: "xin nhẹ tay — hàng dễ vỡ"
  example:
    en: "The crates were clearly marked {fragile} before they were loaded."
    vi: "Các thùng gỗ đã được dán nhãn hàng dễ vỡ rõ ràng trước khi bốc lên xe."

- word: "packaging"
  pos: "noun"
  ipa: "/ˈpækɪdʒɪŋ/"
  meaning: "bao bì đóng gói"
  topic: "purchasing"
  sub-topic: "shipping"
  lesson: ["lesson-16"]
  level: 600
  forms:
    noun: ["packaging", "package"]
    verb: "package"
  collocations:
    - en: "damaged packaging"
      vi: "bao bì bị hư hại"
    - en: "protective packaging"
      vi: "bao bì bảo vệ"
  example:
    en: "The {packaging} was crushed on one side during transit."
    vi: "Phần bao bì bị bẹp một bên trong quá trình vận chuyển."
  note: "'packaging' (bao bì, không đếm được) khác 'package' (kiện hàng, đếm được)."

- word: "damaged"
  pos: "adjective"
  ipa: "/ˈdæmɪdʒd/"
  meaning: "bị hư hại (do va đập, vận chuyển)"
  topic: "purchasing"
  sub-topic: "shipping"
  lesson: ["lesson-16"]
  level: 600
  forms:
    adjective: "damaged"
    noun: "damage"
    verb: "damage"
  collocations:
    - en: "arrive damaged"
      vi: "đến nơi trong tình trạng hư hại"
    - en: "report damaged goods"
      vi: "báo cáo hàng bị hư hại"
  example:
    en: "Half of the units arrived {damaged} because the crate was dropped."
    vi: "Một nửa số sản phẩm đến nơi bị hư hại vì thùng hàng đã bị rơi."
  note: "Danh từ 'damage' không đếm được (không có 'damages' theo nghĩa hư hại; 'damages' số nhiều nghĩa là tiền bồi thường)."

- word: "defective"
  pos: "adjective"
  ipa: "/dɪˈfektɪv/"
  meaning: "bị lỗi (do sản xuất)"
  topic: "purchasing"
  sub-topic: "shipping"
  lesson: ["lesson-16"]
  level: 750
  forms:
    adjective: "defective"
    noun: "defect"
  collocations:
    - en: "a defective item"
      vi: "một sản phẩm bị lỗi"
    - en: "return defective units"
      vi: "trả lại các sản phẩm bị lỗi"
  example:
    en: "Some units were {defective} straight from the factory line."
    vi: "Một số sản phẩm đã bị lỗi ngay từ dây chuyền của nhà máy."
  note: "Phân biệt: 'defective' = lỗi từ khâu sản xuất (bản thân sản phẩm), còn 'damaged' = hỏng do tác động bên ngoài khi vận chuyển. TOEIC rất hay bắt phân biệt cặp này."

- word: "invoice"
  pos: "noun"
  ipa: "/ˈɪnvɔɪs/"
  meaning: "hóa đơn đề nghị thanh toán"
  topic: "purchasing"
  sub-topic: "invoicing-payment"
  lesson: ["lesson-13", "lesson-16"]
  level: 600
  forms:
    noun: "invoice"
    verb: "invoice"
  collocations:
    - en: "settle an invoice"
      vi: "thanh toán một hóa đơn"
    - en: "dispute an invoice"
      vi: "khiếu nại một hóa đơn"
    - en: "attach the invoice"
      vi: "đính kèm hóa đơn"
  example:
    en: "The {invoice} arrived together with the shipment on Tuesday."
    vi: "Hóa đơn được gửi đến cùng lô hàng vào thứ Ba."
  note: "'invoice' là chứng từ bên bán đòi tiền; 'receipt' là biên lai xác nhận đã trả tiền; 'purchase order' là đơn bên mua đặt hàng."

- word: "itemize"
  pos: "verb"
  ipa: "/ˈaɪtəmaɪz/"
  meaning: "liệt kê chi tiết từng khoản"
  topic: "purchasing"
  sub-topic: "invoicing-payment"
  lesson: ["lesson-16"]
  level: 750
  forms:
    verb: "itemize"
    adjective: "itemized"
    noun: "item"
  collocations:
    - en: "an itemized invoice"
      vi: "một hóa đơn liệt kê chi tiết"
    - en: "itemize every charge"
      vi: "liệt kê chi tiết từng khoản phí"
  example:
    en: "The accountant {itemized} every charge on the final bill."
    vi: "Kế toán đã liệt kê chi tiết từng khoản phí trên hóa đơn cuối cùng."

- word: "due"
  pos: "adjective"
  ipa: "/djuː/"
  meaning: "đến hạn (phải thanh toán, phải nộp)"
  topic: "purchasing"
  sub-topic: "invoicing-payment"
  lesson: ["lesson-16"]
  level: 600
  forms:
    adjective: "due"
  collocations:
    - en: "payment is due on the 15th"
      vi: "khoản thanh toán đến hạn vào ngày 15"
    - en: "the due date"
      vi: "ngày đến hạn"
    - en: "past due"
      vi: "quá hạn"
  example:
    en: "Payment was {due} within ten days of receiving the invoice."
    vi: "Khoản thanh toán đến hạn trong vòng mười ngày kể từ khi nhận hóa đơn."
  note: "Đi với 'on' + ngày cụ thể (due on May 3) hoặc 'by' + hạn chót (due by Friday). Đừng nhầm 'due' (đến hạn) với 'valid' (còn hiệu lực)."

- word: "outstanding balance"
  pos: "noun"
  ipa: "/aʊtˈstændɪŋ ˈbæləns/"
  meaning: "số dư chưa thanh toán"
  topic: "purchasing"
  sub-topic: "invoicing-payment"
  lesson: ["lesson-16"]
  level: 750
  forms:
    noun: ["outstanding balance", "balance"]
    adjective: "outstanding"
  collocations:
    - en: "clear an outstanding balance"
      vi: "thanh toán hết số dư còn nợ"
    - en: "an outstanding balance of $2,000"
      vi: "số dư chưa thanh toán là 2.000 đô la"
  example:
    en: "An {outstanding balance} from the previous order still appears on the account."
    vi: "Số dư chưa thanh toán từ đơn hàng trước vẫn còn hiện trên tài khoản."
  note: "'outstanding' ở đây nghĩa là 'chưa thanh toán', khác hẳn nghĩa 'xuất sắc' (an outstanding employee) — bẫy nghĩa kép rất hay gặp."

- word: "refund"
  pos: "noun"
  ipa: "/ˈriːfʌnd/"
  meaning: "tiền hoàn lại"
  topic: "purchasing"
  sub-topic: "invoicing-payment"
  lesson: ["lesson-16"]
  level: 600
  forms:
    noun: "refund"
    verb: "refund"
    adjective: "refundable"
  collocations:
    - en: "request a full refund"
      vi: "yêu cầu hoàn lại toàn bộ tiền"
    - en: "issue a refund"
      vi: "thực hiện hoàn tiền"
    - en: "a non-refundable deposit"
      vi: "khoản đặt cọc không hoàn lại"
  example:
    en: "Ray demanded a full {refund} for the damaged parts."
    vi: "Ray yêu cầu hoàn lại toàn bộ tiền cho số linh kiện bị hư hại."
  note: "Danh từ nhấn âm đầu /ˈriːfʌnd/, động từ nhấn âm sau /rɪˈfʌnd/ — bẫy trọng âm ở phần Listening."

- word: "exchange"
  pos: "verb"
  ipa: "/ɪksˈtʃeɪndʒ/"
  meaning: "đổi hàng, trao đổi"
  topic: "purchasing"
  sub-topic: "invoicing-payment"
  lesson: ["lesson-16"]
  level: 600
  forms:
    verb: "exchange"
    noun: "exchange"
    adjective: "exchangeable"
  collocations:
    - en: "exchange an item for a new one"
      vi: "đổi một sản phẩm lấy sản phẩm mới"
    - en: "in exchange for"
      vi: "để đổi lấy"
  example:
    en: "He asked to {exchange} the defective units for working ones."
    vi: "Anh ấy đề nghị đổi các sản phẩm bị lỗi lấy sản phẩm hoạt động tốt."
  note: "Đổi X LẤY Y dùng giới từ 'for': exchange it for a new one. 'refund' (hoàn tiền) và 'exchange' (đổi hàng) là hai cách xử lý hàng lỗi."

- word: "free of charge"
  pos: "adverb"
  ipa: "/friː əv tʃɑːdʒ/"
  meaning: "miễn phí"
  topic: "purchasing"
  sub-topic: "invoicing-payment"
  lesson: ["lesson-16"]
  level: 750
  forms:
    adverb: "free of charge"
    adjective: "free"
  collocations:
    - en: "repaired free of charge"
      vi: "được sửa chữa miễn phí"
    - en: "sent free of charge"
      vi: "được gửi miễn phí"
  example:
    en: "All replacement units were shipped {free of charge}."
    vi: "Toàn bộ sản phẩm thay thế đã được gửi đi miễn phí."
  note: "Đồng nghĩa với 'at no additional cost' và 'at no cost' — Part 6/7 rất hay hoán đổi các cụm này khi diễn đạt lại."

- word: "at no additional cost"
  pos: "preposition"
  ipa: "/ət nəʊ əˈdɪʃənl kɒst/"
  meaning: "không mất thêm chi phí nào"
  topic: "purchasing"
  sub-topic: "invoicing-payment"
  lesson: ["lesson-16"]
  level: 750
  forms:
    preposition: "at no additional cost"
    adjective: "additional"
    noun: "cost"
  collocations:
    - en: "shipped at no additional cost"
      vi: "được gửi mà không mất thêm chi phí"
    - en: "upgraded at no additional cost"
      vi: "được nâng cấp mà không mất thêm chi phí"
  example:
    en: "The supplier reshipped the order {at no additional cost} to us."
    vi: "Nhà cung cấp đã gửi lại đơn hàng mà chúng tôi không mất thêm chi phí nào."
  note: "Cùng nghĩa với 'free of charge'. Chú ý mạo từ: dùng 'no', không dùng 'without additional cost'."
