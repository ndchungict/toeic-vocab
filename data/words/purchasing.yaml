  forms:
    noun: ["supplies", "supplier"]
    verb: "supply"
  collocations:
    - en: "order more supplies"
      vi: "đặt thêm vật tư"
    - en: "office supplies"
      vi: "văn phòng phẩm"
  example:
    en: "We need to order more {supplies} before the shipment leaves."
    vi: "Chúng ta cần đặt thêm vật tư trước khi lô hàng được gửi đi."
  note: "Nghĩa 'vật tư' luôn ở dạng số nhiều 'supplies'. Số ít 'supply' mang nghĩa 'nguồn cung' (supply and demand)."

- word: "surplus"
  pos: "noun"
  ipa: "/ˈsɜːpləs/"
