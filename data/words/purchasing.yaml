    - en: "at a discount"
      vi: "với giá đã giảm"
  example:
    en: "Orders over 500 units qualify for a 25% {discount}."
    vi: "Các đơn hàng trên 500 sản phẩm được hưởng mức giảm giá 25%."

- word: "markdown"
  pos: "noun"
