      vi: "bổ sung vật tư"
    - en: "replenish the stock"
      vi: "bổ sung hàng trong kho"
  example:
    en: "The warehouse must {replenish} any item that falls below fifty units."
    vi: "Kho phải bổ sung bất kỳ mặt hàng nào còn dưới năm mươi đơn vị."

- word: "backorder"
  pos: "noun"
  ipa: "/ˈbækɔːdə(r)/"
  meaning: "đơn hàng chờ (do tạm hết hàng)"
  topic: "purchasing"
  sub-topic: "inventory-supplies"
  lesson: ["lesson-15"]
  level: 900
  forms:
    noun: "backorder"
    verb: "backorder"
  collocations:
    - en: "be on backorder"
      vi: "đang trong tình trạng chờ hàng"
    - en: "place an item on backorder"
      vi: "đưa một mặt hàng vào diện chờ hàng"
  example:
    en: "The microchips are on {backorder} and will ship in three weeks."
    vi: "Số vi mạch đang trong diện chờ hàng và sẽ được gửi sau ba tuần."
  note: "Luôn đi với giới từ 'on': the item is on backorder."

- word: "supplies"
  pos: "noun"
  ipa: "/səˈplaɪz/"
  meaning: "vật tư, đồ dùng phục vụ công việc"
  topic: "purchasing"
  sub-topic: "inventory-supplies"
  lesson: ["lesson-02", "lesson-15"]
