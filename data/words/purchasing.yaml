- word: "purchase"
  pos: "verb"
  ipa: "/ˈpɜːtʃəs/"
  meaning: "mua (hàng hóa, thiết bị); việc mua"
  topic: "purchasing"
  sub-topic: "ordering"
  lesson: ["lesson-15"]
  level: 600
  forms:
    verb: "purchase"
    noun: ["purchase", "purchaser"]
  collocations:
    - en: "make a purchase"
      vi: "thực hiện một giao dịch mua"
    - en: "purchase equipment from a supplier"
      vi: "mua thiết bị từ một nhà cung cấp"
    - en: "proof of purchase"
      vi: "bằng chứng mua hàng"
  example:
    en: "The company {purchased} parts from three different vendors last quarter."
    vi: "Công ty đã mua linh kiện từ ba nhà cung cấp khác nhau trong quý trước."
  note: "'purchase' trang trọng hơn 'buy' và hay xuất hiện trong văn bản TOEIC. Danh từ 'purchase' đếm được (a purchase), khác 'merchandise' không đếm được."

- word: "place an order"
  pos: "verb"
  ipa: "/pleɪs ən ˈɔːdə(r)/"
  meaning: "đặt hàng"
  topic: "purchasing"
  sub-topic: "ordering"
  lesson: ["lesson-15"]
  level: 750
  forms:
    verb: "place an order"
    noun: "order"
  collocations:
    - en: "place an order with a supplier"
      vi: "đặt hàng với một nhà cung cấp"
    - en: "place a large order"
      vi: "đặt một đơn hàng lớn"
  example:
    en: "Please {place an order} through the online system before Friday."
    vi: "Vui lòng đặt hàng qua hệ thống trực tuyến trước thứ Sáu."
  note: "Dùng động từ 'place', KHÔNG dùng 'make an order'. Đặt hàng VỚI ai thì dùng 'with': place an order with a supplier."

- word: "purchase order"
  pos: "noun"
  ipa: "/ˈpɜːtʃəs ˈɔːdə(r)/"
  meaning: "đơn đặt hàng (chứng từ chính thức)"
  topic: "purchasing"
  sub-topic: "ordering"
  lesson: ["lesson-15"]
  level: 750
  forms:
    noun: "purchase order"
    verb: "purchase"
  collocations:
    - en: "issue a purchase order"
      vi: "phát hành một đơn đặt hàng"
    - en: "approve a purchase order"
      vi: "phê duyệt một đơn đặt hàng"
  example:
    en: "Each shipment must be accompanied by a signed {purchase order}."
    vi: "Mỗi lô hàng phải kèm theo một đơn đặt hàng đã ký."
  note: "Viết tắt là PO. Đây là chứng từ bên MUA gửi cho bên bán, khác 'invoice' là chứng từ bên BÁN đòi tiền."

- word: "supplier"
  pos: "noun"
  ipa: "/səˈplaɪə(r)/"
  meaning: "nhà cung cấp"
  topic: "purchasing"
  sub-topic: "ordering"
  lesson: ["lesson-15"]
  level: 600
  forms:
    noun: ["supplier", "supply"]
    verb: "supply"
  collocations:
    - en: "a reliable supplier"
      vi: "một nhà cung cấp đáng tin cậy"
    - en: "switch suppliers"
      vi: "đổi nhà cung cấp"
  example:
    en: "They rely on a single {supplier} for all of their microchips."
    vi: "Họ phụ thuộc vào một nhà cung cấp duy nhất cho toàn bộ vi mạch."

- word: "vendor"
  pos: "noun"
  ipa: "/ˈvendə(r)/"
  meaning: "bên bán, nhà cung cấp"
  topic: "purchasing"
  sub-topic: "ordering"
  lesson: ["lesson-15"]
  level: 750
  forms:
    noun: ["vendor", "vending"]
  collocations:
    - en: "approved vendors"
      vi: "các nhà cung cấp đã được duyệt"
    - en: "select a vendor"
      vi: "chọn một bên bán"
  example:
    en: "Only approved {vendors} are allowed to bid on the contract."
    vi: "Chỉ những nhà cung cấp đã được duyệt mới được phép dự thầu hợp đồng này."
  note: "'vendor' ≈ 'supplier'. TOEIC hay hoán đổi hai từ này trong Part 6/7 khi diễn đạt lại (paraphrase)."

- word: "quotation"
  pos: "noun"
  ipa: "/kwəʊˈteɪʃn/"
  meaning: "bảng báo giá"
  topic: "purchasing"
  sub-topic: "ordering"
  lesson: ["lesson-15"]
  level: 750
  forms:
    noun: ["quotation", "quote"]
    verb: "quote"
  collocations:
    - en: "request a quotation"
      vi: "yêu cầu một bảng báo giá"
    - en: "a written quotation"
      vi: "một báo giá bằng văn bản"
  example:
    en: "Ray requested a {quotation} from each supplier before deciding."
    vi: "Ray đã yêu cầu báo giá từ từng nhà cung cấp trước khi quyết định."
  note: "'quote' là dạng nói ngắn gọn của 'quotation', dùng thay thế được. Đừng nhầm với nghĩa 'trích dẫn'."

- word: "bid"
  pos: "noun"
  ipa: "/bɪd/"
  meaning: "hồ sơ chào thầu, giá bỏ thầu"
  topic: "purchasing"
  sub-topic: "ordering"
  lesson: ["lesson-15"]
  level: 750
  forms:
    noun: ["bid", "bidder"]
    verb: "bid"
  collocations:
    - en: "submit a bid"
      vi: "nộp hồ sơ chào thầu"
    - en: "win the bid"
      vi: "thắng thầu"
    - en: "the lowest bid"
      vi: "giá bỏ thầu thấp nhất"
  example:
    en: "The lowest qualified {bid} won the maintenance contract."
    vi: "Hồ sơ chào thầu hợp lệ có giá thấp nhất đã thắng hợp đồng bảo trì."
  note: "Động từ 'bid' bất quy tắc: bid – bid – bid. 'bid on/for sth' = dự thầu cho việc gì."

- word: "in bulk"
  pos: "preposition"
  ipa: "/ɪn bʌlk/"
  meaning: "với số lượng lớn"
  topic: "purchasing"
  sub-topic: "ordering"
