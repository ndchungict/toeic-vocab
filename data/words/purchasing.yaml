  sub-topic: "inventory-supplies"
  lesson: ["lesson-14", "lesson-15"]
  level: 600
  forms:
    noun: "stock"
    verb: "stock"
  collocations:
    - en: "in stock"
      vi: "còn hàng"
    - en: "out of stock"
      vi: "hết hàng"
    - en: "run out of stock"
      vi: "cạn hàng trong kho"
  example:
    en: "The item you requested is currently out of {stock}."
    vi: "Mặt hàng bạn yêu cầu hiện đang hết hàng."
  note: "Ở chủ đề Purchasing, 'stock' = hàng trong kho; ở chủ đề Finance, 'stock' = cổ phiếu. Đọc ngữ cảnh để chọn nghĩa."

- word: "replenish"
