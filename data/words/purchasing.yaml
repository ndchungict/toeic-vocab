  topic: "purchasing"
  sub-topic: "inventory-supplies"
  lesson: ["lesson-14", "lesson-15"]
  level: 900
  forms:
    noun: "surplus"
    adjective: "surplus"
  collocations:
    - en: "surplus stock"
      vi: "hàng tồn dư thừa"
    - en: "sell off the surplus"
      vi: "bán tháo phần hàng dư"
  example:
    en: "The extra parts became {surplus} once the project was cancelled."
    vi: "Số linh kiện thừa trở thành hàng dư sau khi dự án bị hủy."
  note: "Ở Purchasing, 'surplus' = hàng dư thừa; ở Finance, 'surplus' = thặng dư ngân sách. Trái nghĩa: 'shortage' / 'deficit'."

- word: "shipment"
  pos: "noun"
  ipa: "/ˈʃɪpmənt/"
