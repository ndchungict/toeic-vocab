      vi: "một nhà phân phối bán buôn"
  example:
    en: "Factories buy their materials at {wholesale} prices, not retail."
    vi: "Các nhà máy mua nguyên vật liệu theo giá bán buôn, không phải giá bán lẻ."
  note: "Cặp đối lập bắt buộc nhớ: 'wholesale' (bán buôn, số lượng lớn) ↔ 'retail' (bán lẻ, bán cho người tiêu dùng)."

- word: "discount"
