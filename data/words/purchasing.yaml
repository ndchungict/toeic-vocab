      vi: "mua với số lượng lớn"
    - en: "a bulk order"
      vi: "một đơn hàng số lượng lớn"
  example:
    en: "Buying paper {in bulk} earns the office a bigger discount."
    vi: "Mua giấy với số lượng lớn giúp văn phòng được giảm giá nhiều hơn."

- word: "wholesale"
  pos: "noun"
  ipa: "/ˈhəʊlseɪl/"
  meaning: "bán buôn, bán sỉ"
  topic: "purchasing"
  sub-topic: "ordering"
  lesson: ["lesson-15"]
