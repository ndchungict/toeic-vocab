    - en: "reduce excess inventory"
      vi: "giảm lượng hàng tồn kho dư thừa"
  example:
    en: "The staff took {inventory} of every shelf in the warehouse."
    vi: "Nhân viên đã kiểm kê từng kệ hàng trong kho."
  note: "Cụm cố định 'take inventory' = kiểm kê (không dùng 'do inventory')."

- word: "stock"
