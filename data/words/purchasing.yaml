- word: "carrier"
  pos: "noun"
  ipa: "/ˈkæriə(r)/"
  meaning: "hãng vận chuyển"
  topic: "purchasing"
  sub-topic: "shipping"
  lesson: ["lesson-16"]
  level: 750
  forms:
