- id: "exercise-07-p5-01"
  part: 5
  topic: "general-business"
  lesson: ["lesson-07"]
  level: 600
  related_word: "warranty"
  question: "The refrigerator is still under ______, so Aster will fix it at no cost."
  options: { A: "coverage", B: "warranty", C: "deadline", D: "benchmark" }
  answer: "B"
  explanation_vi: "\"be under warranty\" = còn trong thời hạn bảo hành; hợp với \"fix it at no cost\". *coverage* (phạm vi) không đi với \"under\" kiểu này; *deadline/benchmark* sai nghĩa."

