# EXERCISE 05 — GENERAL BUSINESS: Hợp đồng & Đàm phán · Sáp nhập & Cơ cấu công ty
# Nguồn: exercises/exercise-05.md (lesson-05)
# 25 câu: Part 5 (1-12), Part 6 (13-19), Part 7 (20-25)

- id: "exercise-05-p5-01"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: 600
  related_word: "negotiate"
  question: "After weeks of talks, the two firms finally ______ a distribution agreement that satisfied both sides."
  options: { A: "negotiated", B: "retired", C: "expanded", D: "dismissed" }
  answer: "A"
  explanation_vi: "\"negotiate an agreement/deal\" = đàm phán để đạt thỏa thuận; hợp với \"after weeks of talks\". *retired/expanded/dismissed* sai nghĩa hoàn toàn."

- id: "exercise-05-p5-02"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: 750
  related_word: "clause"
  question: "The contract contains a confidentiality ______ that prevents either party from sharing technical data."
  options: { A: "clause", B: "stakeholder", C: "turnover", D: "headquarters" }
  answer: "A"
  explanation_vi: "\"a confidentiality clause\" = điều khoản bảo mật (collocation cố định). *stakeholder/turnover/headquarters* không phải một phần của hợp đồng."

- id: "exercise-05-p5-03"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: 900
  related_word: "binding"
  question: "Once both directors have signed it, the agreement becomes legally ______ on both companies."
  options: { A: "negotiable", B: "binding", C: "void", D: "liable" }
  answer: "B"
  explanation_vi: "\"legally binding on both parties\" = ràng buộc pháp lý. *negotiable* (còn thương lượng được) và *void* (vô hiệu) trái nghĩa; *liable* sai form (đi với \"for\")."

- id: "exercise-05-p5-04"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: 900
  related_word: "void"
  question: "If the product is not launched by the agreed date, the entire contract will become null and ______."
  options: { A: "void", B: "binding", C: "valid", D: "pending" }
  answer: "A"
  explanation_vi: "cụm cố định \"null and void\" = vô hiệu hoàn toàn. *binding/valid* trái nghĩa; *pending* (đang chờ) sai ngữ cảnh."

- id: "exercise-05-p5-05"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: 900
  related_word: "concession"
  question: "Neither side wanted to give ground, but in the end each made a small ______ to close the deal."
  options: { A: "obligation", B: "concession", C: "breach", D: "provision" }
  answer: "B"
  explanation_vi: "\"make a concession\" = nhượng bộ; hợp với \"neither side wanted to give ground\". *obligation/breach/provision* sai nghĩa."

- id: "exercise-05-p5-06"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: null
  related_word: null
  question: "All appliances sold in Halston must comply ______ the country's strict safety regulations."
  options: { A: "with", B: "to", C: "by", D: "for" }
  answer: "A"
  explanation_vi: "\"comply **with** regulations\" — giới từ cố định. ⚠️ Đây là bẫy giới từ kinh điển: comply luôn + **with**."

- id: "exercise-05-p5-07"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: 900
  related_word: "abide by"
  question: "By signing here, both parties agree to ______ the terms set out in this document."
  options: { A: "abide by", B: "comply", C: "breach", D: "amend" }
  answer: "A"
  explanation_vi: "\"abide by the terms\" = tuân thủ các điều khoản. *comply* thiếu \"with\" nên sai; *breach* (vi phạm) trái nghĩa; *amend* (sửa đổi) sai nghĩa."

- id: "exercise-05-p5-08"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: 900
  related_word: "breach"
  question: "Failing to deliver the goods on time would be considered a ______ of contract."
  options: { A: "clause", B: "breach", C: "provision", D: "concession" }
  answer: "B"
  explanation_vi: "\"a breach of contract\" = vi phạm hợp đồng; hợp với \"failing to deliver on time\". *clause/provision/concession* không đi với \"of contract\" theo nghĩa vi phạm."

- id: "exercise-05-p5-09"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: 900
  related_word: "liable"
  question: "Under the agreement, the supplier is ______ for any damage caused by faulty parts."
  options: { A: "eligible", B: "liable", C: "reliable", D: "negotiable" }
  answer: "B"
  explanation_vi: "\"be **liable for** damage\" = chịu trách nhiệm pháp lý. ⚠️ Bẫy: *reliable* (đáng tin) khác hẳn nghĩa; *eligible* (đủ điều kiện) + for nhưng sai nghĩa; *negotiable* sai nghĩa."

- id: "exercise-05-p5-10"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: 750
  related_word: "acquisition"
  question: "Neura's proposed ______ would give it full ownership of Aster and its technology."
  options: { A: "acquisition", B: "arbitration", C: "obligation", D: "reservation" }
  answer: "A"
  explanation_vi: "\"acquisition… full ownership\" = thâu tóm để sở hữu hoàn toàn. *arbitration/obligation/reservation* sai nghĩa."

- id: "exercise-05-p5-11"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: 900
  related_word: "subsidiary"
  question: "After the takeover, the smaller firm would operate as a wholly-owned ______ of the larger group."
  options: { A: "stakeholder", B: "subsidiary", C: "headquarters", D: "breach" }
  answer: "B"
  explanation_vi: "\"a wholly-owned subsidiary\" = công ty con sở hữu toàn phần (collocation cố định). *stakeholder/headquarters/breach* sai loại. ⚠️ subsidiary ≠ affiliate (liên kết lỏng hơn)."

- id: "exercise-05-p5-12"
  part: 5
  topic: "general-business"
  lesson: ["lesson-05"]
  level: 600
  related_word: "expand"
  question: "Rather than sell the company, the CEO chose to ______ into new overseas markets independently."
  options: { A: "expand", B: "restructure", C: "amend", D: "comply" }
  answer: "A"
  explanation_vi: "\"expand **into** new markets\" = mở rộng sang thị trường mới. *restructure* (tái cơ cấu), *amend* (sửa đổi), *comply* (tuân thủ) đều sai ngữ cảnh."

