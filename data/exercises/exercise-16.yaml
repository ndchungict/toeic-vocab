    After our main supplier failed to deliver, we secured a replacement lot of chips from Halston Components Co. To meet the fixed launch date, the shipment was flown in and expedited rather than sent by sea freight, which added a significant surcharge on top of shipping and handling. On arrival, however, the packaging was crushed and about half the units were damaged in transit, while a smaller number were found to be defective from the factory. We have demanded a refund for the unusable units and negotiated replacements at no additional cost.
