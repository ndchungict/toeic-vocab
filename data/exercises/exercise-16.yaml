- id: "exercise-16-p7-24"
  part: 7
  topic: "purchasing"
  lesson: ["lesson-16"]
  level: null
  passage_group: "p7-24-26"
  passage: |
    **Marlowe Business Journal — Aster Beats the Clock, But at What Cost?**
    Aster Home Technologies has managed to keep its Aria line moving after a last-minute supply crisis. When its main chip supplier missed its deadline, the operations team rushed a replacement shipment from an alternative vendor and paid a premium to expedite delivery. Aster also won a refund on parts that arrived damaged. Yet industry watchers remain cautious. The replacement chips, they note, came from older clearance stock that was never fully tested, and quality problems in a smart-home device can be costly to fix once units are already on the assembly line.
  related_word: null
  question: "How did Aster keep the Aria line moving?"
  options: { A: "By cancelling the launch", B: "By rushing a replacement shipment and expediting delivery", C: "By returning to its original supplier", D: "By pausing all production" }
  answer: "B"
  explanation_vi: "giữ dây chuyền chạy bằng cách \"rushed a **replacement shipment**… paid a premium to **expedite** delivery\". (A)/(C)/(D) sai."

