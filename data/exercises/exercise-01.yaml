    — Harold
  related_word: null
  question: "What did Harold send to Diane?"
  options: { A: "A résumé", B: "A proposal from Neura", C: "An invoice", D: "A voicemail" }
  answer: "B"
  explanation_vi: "Harold gửi Diane **đề nghị của Neura** (dưới dạng attachment)."

