# EXERCISE 01 — OFFICES: Họp & Ủy ban · Thư từ & Liên lạc
# Nguồn: exercises/exercise-01.md (lesson-01 — "Project Aria" Chương 1)
# 26 câu: Part 5 (1-12), Part 6 (13-20), Part 7 (21-26)

- id: "exercise-01-p5-01"
  part: 5
  topic: "offices"
  lesson: ["lesson-01"]
  level: 900
  related_word: "convene"
  question: "The board of directors will ______ next Tuesday to vote on the expansion plan."
  options: { A: "enclose", B: "convene", C: "remind", D: "postpone" }
  answer: "B"
  explanation_vi: "\"convene a meeting\" = triệu tập họp. Các từ kia không hợp: enclose (gửi kèm), remind (nhắc), postpone (hoãn)."

- id: "exercise-01-p5-02"
  part: 5
  topic: "offices"
  lesson: ["lesson-01"]
  level: 900
  related_word: "quorum"
  question: "Because two members were absent, the committee did not have a ______ and the vote was delayed."
  options: { A: "proxy", B: "quorum", C: "consensus", D: "minutes" }
  answer: "B"
  explanation_vi: "thiếu người → không đủ **quorum** (số đại biểu tối thiểu). \"consensus\" là sự đồng thuận, không hợp ngữ cảnh \"have a ___\"."

- id: "exercise-01-p5-03"
  part: 5
  topic: "offices"
  lesson: ["lesson-01"]
  level: 600
  related_word: "notify"
  question: "Please ______ all staff of the change in the meeting schedule."
  options: { A: "chair", B: "enclose", C: "notify", D: "adjourn" }
  answer: "C"
  explanation_vi: "\"notify sb of sth\" = thông báo cho ai về việc gì. Đúng cấu trúc với \"of the change\"."

- id: "exercise-01-p5-04"
  part: 5
  topic: "offices"
  lesson: ["lesson-01"]
  level: 900
  related_word: "unanimous"
  question: "The decision was ______; every board member voted in favor."
  options: { A: "confidential", B: "prospective", C: "unanimous", D: "overdue" }
  answer: "C"
  explanation_vi: "mọi người bỏ phiếu thuận → quyết định **unanimous** (nhất trí hoàn toàn)."

