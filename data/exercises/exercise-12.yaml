  part: 5
  topic: "dining-out"
  lesson: ["lesson-12"]
  level: 600
  related_word: "appetizer"
  question: "The group shared a seafood ______ before their main courses arrived."
  options: { A: "appetizer", B: "gratuity", C: "server", D: "reservation" }
