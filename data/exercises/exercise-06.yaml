# EXERCISE 06 — GENERAL BUSINESS: Marketing & Bán hàng
# Nguồn: exercises/exercise-06.md (lesson-06)
# 25 câu: Part 5 (1-12), Part 6 (13-19), Part 7 (20-25)

- id: "exercise-06-p5-01"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 600
  related_word: "campaign"
  question: "To introduce Aria to Halston, Daniel launched the biggest marketing ______ in the company's history."
  options: { A: "questionnaire", B: "forecast", C: "campaign", D: "outlet" }
  answer: "C"
  explanation_vi: "\"launch a marketing campaign\" = mở chiến dịch marketing. *questionnaire/forecast/outlet* sai nghĩa."

- id: "exercise-06-p5-02"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 600
  related_word: "promote"
  question: "The team used social media and television ads to ______ the new smart-home system."
  options: { A: "survey", B: "decline", C: "forecast", D: "promote" }
  answer: "D"
  explanation_vi: "\"use ads to promote a product\" = dùng quảng cáo để quảng bá. *survey* (khảo sát), *decline* (sụt giảm/từ chối), *forecast* (dự báo) sai nghĩa. ⚠️ promote = quảng bá (và cũng = thăng chức)."

- id: "exercise-06-p5-03"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 750
  related_word: "target market"
  question: "Market research showed that Aria's ______ was young, tech-savvy city dwellers."
  options: { A: "loyalty program", B: "target market", C: "questionnaire", D: "testimonial" }
  answer: "B"
  explanation_vi: "\"target market\" = nhóm khách hàng nhắm tới (\"young city dwellers\"). *loyalty program/questionnaire/testimonial* sai nghĩa."

- id: "exercise-06-p5-04"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 600
  related_word: "consumer"
  question: "Understanding ______ behavior helps a company design advertisements that actually work."
  options: { A: "consumer", B: "competitor", C: "voucher", D: "quota" }
  answer: "A"
  explanation_vi: "\"consumer behavior\" = hành vi người tiêu dùng (collocation cố định). *competitor* (đối thủ) không đi với \"behavior\" ở đây; *voucher/quota* sai nghĩa."

- id: "exercise-06-p5-05"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 600
  related_word: "survey"
  question: "Before designing the campaign, the marketing team conducted a ______ of two thousand shoppers."
  options: { A: "brand", B: "demand", C: "survey", D: "outlet" }
  answer: "C"
  explanation_vi: "\"conduct a survey of 2,000 shoppers\" = tiến hành khảo sát. *brand/demand/outlet* không \"conducted\"."

- id: "exercise-06-p5-06"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 600
  related_word: "feedback"
  question: "The company reads customer ______ carefully so that it can keep improving its products."
  options: { A: "advertisement", B: "quota", C: "competitor", D: "feedback" }
  answer: "D"
  explanation_vi: "\"customer feedback… improve products\" = phản hồi khách hàng. *advertisement/quota/competitor* sai nghĩa."

- id: "exercise-06-p5-07"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 900
  related_word: "endorse"
  question: "The firm paid a famous athlete to ______ its new line of kitchen appliances."
  options: { A: "decline", B: "forecast", C: "endorse", D: "survey" }
  answer: "C"
  explanation_vi: "\"pay a celebrity to endorse a product\" = mời người nổi tiếng chứng thực/quảng bá. *decline/forecast/survey* sai nghĩa."

- id: "exercise-06-p5-08"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 600
  related_word: "competitive"
  question: "With so many rivals in the market, Aster had to keep its prices ______."
  options: { A: "exclusive", B: "reluctant", C: "obsolete", D: "competitive" }
  answer: "D"
  explanation_vi: "\"keep prices competitive\" = giữ giá có sức cạnh tranh; hợp với \"so many rivals\". *exclusive* (độc quyền) sai; *reluctant/obsolete* sai nghĩa. ⚠️ competitive (adj) ≠ competitor (n)."

- id: "exercise-06-p5-09"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 750
  related_word: "exclusive"
  question: "Brightway was granted an ______ right to sell Aria in Halston for the first year."
  options: { A: "exclusive", B: "competitive", C: "available", D: "eligible" }
  answer: "A"
  explanation_vi: "\"an exclusive right to sell\" = quyền phân phối độc quyền. *competitive/available/eligible* sai nghĩa/collocation."

- id: "exercise-06-p5-10"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 600
  related_word: "boost"
  question: "The company offered free delivery to ______ sales during the launch week."
  options: { A: "decline", B: "endorse", C: "boost", D: "survey" }
  answer: "C"
  explanation_vi: "\"boost sales\" = thúc đẩy doanh số; *decline* (giảm) trái nghĩa; *endorse/survey* sai nghĩa."

- id: "exercise-06-p5-11"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 750
  related_word: "forecast"
  question: "Analysts study past data to make a reliable sales ______ for the coming year."
  options: { A: "quota", B: "forecast", C: "voucher", D: "brand" }
  answer: "B"
  explanation_vi: "\"a sales forecast… from past data\" = dự báo doanh số. *quota* (chỉ tiêu phải đạt, không phải con số dự báo), *voucher/brand* sai nghĩa. ⚠️ forecast (dự báo) ≠ quota (chỉ tiêu)."

- id: "exercise-06-p5-12"
  part: 5
  topic: "general-business"
  lesson: ["lesson-06"]
  level: 900
  related_word: "word of mouth"
  question: "Many small businesses grow mainly through ______, as happy customers tell their friends."
  options: { A: "questionnaire", B: "arbitration", C: "turnover", D: "word of mouth" }
  answer: "D"
  explanation_vi: "\"grow through word of mouth… customers tell friends\" = truyền miệng. *questionnaire/arbitration/turnover* sai nghĩa."

