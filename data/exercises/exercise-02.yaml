  lesson: ["lesson-02"]
  level: 600
  related_word: "distribute"
  question: "Ms. Nair will ______ copies of the new plan to every department head this afternoon."
  options: { A: "duplicate", B: "distribute", C: "streamline", D: "jam" }
  answer: "B"
