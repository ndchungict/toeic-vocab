- id: "exercise-02-p5-01"
  part: 5
  topic: "offices"
  lesson: ["lesson-02"]
  level: 600
  related_word: "procedure"
  question: "All employees must follow the correct ______ when requesting new office equipment."
  options: { A: "protocol", B: "procedure", C: "prompt", D: "cubicle" }
  answer: "B"
  explanation_vi: "\"follow the correct procedure\" = tuân theo đúng quy trình (các bước cụ thể để làm một việc)."

- id: "exercise-02-p5-02"
  part: 5
  topic: "offices"
  lesson: ["lesson-02"]
  level: 750
  related_word: "protocol"
  question: "According to company ______, every visitor must sign in at the front desk before entering."
  options: { A: "procedure", B: "protocol", C: "supplies", D: "workstation" }
  answer: "B"
  explanation_vi: "\"company protocol\" = quy tắc/nghi thức chung. Khác *procedure*: protocol là quy tắc ứng xử/nghi thức, còn procedure là chuỗi các bước thực hiện."

- id: "exercise-02-p5-03"
  part: 5
