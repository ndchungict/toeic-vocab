- id: "exercise-03-p5-06"
  part: 5
  topic: "personnel"
  lesson: ["lesson-03"]
  level: 600
  related_word: "reference"
  question: "Ben listed two of his former managers as ______ who could speak to his character."
  options: { A: "applicants", B: "references", C: "subordinates", D: "candidates" }
  answer: "B"
  explanation_vi: "người đứng ra bảo chứng cho ứng viên = **references**. *candidates/applicants* là chính ứng viên, không phải người giới thiệu."

- id: "exercise-03-p5-07"
  part: 5
  topic: "personnel"
  lesson: ["lesson-03"]
  level: 600
  related_word: "interview"
  question: "Ben was extremely nervous during his job ______, but his honest answers impressed the panel."
  options: { A: "orientation", B: "probation", C: "interview", D: "appraisal" }
  answer: "C"
  explanation_vi: "\"job interview\" = buổi phỏng vấn xin việc; \"nervous during the interview\" là ngữ cảnh điển hình."

- id: "exercise-03-p5-08"
  part: 5
  topic: "personnel"
  lesson: ["lesson-03"]
  level: 600
  related_word: "hire"
  question: "Impressed by his eagerness to learn, Priya decided to ______ Ben as a management trainee."
  options: { A: "interview", B: "hire", C: "mentor", D: "supervise" }
  answer: "B"
  explanation_vi: "\"hire sb as + chức danh\" = tuyển ai vào vị trí gì. *interview* (phỏng vấn) chưa phải \"nhận vào\"; *mentor/supervise* là hướng dẫn/giám sát."

- id: "exercise-03-p5-09"
  part: 5
  topic: "personnel"
  lesson: ["lesson-03"]
  level: 750
  related_word: "prospective"
  question: "A ______ employee like Ben may lack experience, but he shows real potential to grow with the company."
  options: { A: "prospective", B: "competent", C: "confidential", D: "vacant" }
  answer: "A"
  explanation_vi: "\"a prospective employee\" = nhân viên tiềm năng (tương lai). *competent* (đã có năng lực) trái với vế \"lack experience\"."

