  topic: "personnel"
  lesson: ["lesson-03"]
  level: 750
  related_word: "credentials"
  question: "Before making an offer, the HR team carefully verified each finalist's ______, including diplomas and certificates."
  options: { A: "credentials", B: "minutes", C: "supplies", D: "vacancies" }
  answer: "A"
