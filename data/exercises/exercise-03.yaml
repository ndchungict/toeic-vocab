- id: "exercise-03-p5-01"
  part: 5
  topic: "personnel"
  lesson: ["lesson-03"]
  level: 600
  related_word: "recruit"
  question: "To keep up with the growing workload on Project Aria, Ms. Nair decided to ______ additional staff as quickly as possible."
  options: { A: "recruit", B: "reschedule", C: "resign", D: "relocate" }
  answer: "A"
  explanation_vi: "\"recruit staff\" = tuyển dụng nhân sự (nói chung, cả đợt). *reschedule/resign/relocate* sai nghĩa."

- id: "exercise-03-p5-02"
  part: 5
  topic: "personnel"
  lesson: ["lesson-03"]
  level: 600
  related_word: "candidate"
  question: "After reviewing every résumé, Priya shortlisted only the five strongest ______ for an interview."
  options: { A: "references", B: "candidates", C: "supervisors", D: "mentors" }
  answer: "B"
  explanation_vi: "\"shortlist candidates\" = lập danh sách rút gọn các ứng viên. *references* (người giới thiệu) là bẫy nghĩa gần."

- id: "exercise-03-p5-03"
  part: 5
  topic: "personnel"
  lesson: ["lesson-03"]
  level: 600
  related_word: "résumé"
  question: "Each application must include a ______ and a cover letter describing the person's work experience."
  options: { A: "probation", B: "résumé", C: "vacancy", D: "quorum" }
  answer: "B"
  explanation_vi: "bộ hồ sơ gồm \"a résumé and a cover letter\". *vacancy/probation/quorum* không phải tài liệu ứng tuyển."

- id: "exercise-03-p5-04"
  part: 5
  topic: "personnel"
  lesson: ["lesson-03"]
  level: 600
  related_word: "qualification"
  question: "Applicants who do not meet the minimum ______ will not be invited to the interview."
  options: { A: "qualifications", B: "appraisals", C: "orientations", D: "subordinates" }
  answer: "A"
  explanation_vi: "\"meet the minimum qualifications\" = đạt trình độ/bằng cấp tối thiểu."

- id: "exercise-03-p5-05"
