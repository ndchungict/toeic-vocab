# EXERCISE 04 — PERSONNEL: Lương & Phúc lợi · Thăng chức, Khen thưởng & Nghỉ việc
# Nguồn: exercises/exercise-04.md (lesson-04)
# 25 câu: Part 5 (1-12), Part 6 (13-19), Part 7 (20-25)

- id: "exercise-04-p5-01"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 600
  related_word: "raise"
  question: "After two years without any pay increase, several engineers decided to ask for a ______."
  options: { A: "morale", B: "raise", C: "turnover", D: "allowance" }
  answer: "B"
  explanation_vi: "\"ask for a raise\" = xin tăng lương; hợp với \"without any pay increase\". *morale/turnover/allowance* sai nghĩa. ⚠️ raise (n) = khoản tăng lương."

- id: "exercise-04-p5-02"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 750
  related_word: "eligible"
  question: "Employees who have been on the payroll for at least one year are ______ for the annual retention bonus."
  options: { A: "entitled", B: "competent", C: "eligible", D: "proficient" }
  answer: "C"
  explanation_vi: "\"be **eligible for** sth\" = đủ điều kiện nhận gì. *entitled* đi với **to**, không hợp giới từ ở đây; *competent/proficient* nói về năng lực."

- id: "exercise-04-p5-03"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 750
  related_word: "entitled"
  question: "Under the new policy, every full-time worker is ______ to fifteen days of paid leave each year."
  options: { A: "eligible", B: "entitled", C: "liable", D: "available" }
  answer: "B"
  explanation_vi: "\"be **entitled to** sth\" = có quyền được hưởng. Đây là cặp bẫy với câu 2: *eligible* + **for**, *entitled* + **to**. *liable* (chịu trách nhiệm) sai nghĩa."

- id: "exercise-04-p5-04"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 600
  related_word: "overtime"
  question: "Because of the tight deadline, many staff had to work ______ throughout the month."
  options: { A: "payroll", B: "turnover", C: "severance", D: "overtime" }
  answer: "D"
  explanation_vi: "\"work overtime\" = làm thêm giờ; hợp với \"tight deadline… throughout the month\". *payroll/turnover/severance* không đi với \"work\"."

- id: "exercise-04-p5-05"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 750
  related_word: "compensation"
  question: "The ______ package Aster offered included a competitive salary, full benefits, and a year-end bonus."
  options: { A: "recognition", B: "probation", C: "reference", D: "compensation" }
  answer: "D"
  explanation_vi: "\"compensation package\" gồm salary + benefits + bonus = gói đãi ngộ tổng. *recognition/probation/reference* sai loại gói."

- id: "exercise-04-p5-06"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 750
  related_word: "resign"
  question: "Frustrated by the slow pace of promotion, the senior developer threatened to ______."
  options: { A: "resign", B: "recruit", C: "retire", D: "relocate" }
  answer: "A"
  explanation_vi: "\"threatened to resign\" = dọa xin nghỉ; người \"frustrated by slow promotion\" chủ động nghỉ → **resign**. *retire* là nghỉ hưu (do tuổi), *recruit/relocate* sai nghĩa. ⚠️ resign (tự nghỉ) ≠ dismiss/lay off (bị nghỉ)."

- id: "exercise-04-p5-07"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 600
  related_word: "promotion"
  question: "In recognition of her strong results, Ms. Marchetti was put up for a ______ to department head."
  options: { A: "pension", B: "promotion", C: "dismissal", D: "vacancy" }
  answer: "B"
  explanation_vi: "\"be up for a promotion\" = đang được xét thăng chức; \"a promotion **to** department head\". *pension/dismissal/vacancy* sai nghĩa."

- id: "exercise-04-p5-08"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 750
  related_word: "turnover"
  question: "High employee ______ is costly, because replacing and training new staff takes both time and money."
  options: { A: "turnover", B: "overtime", C: "workforce", D: "morale" }
  answer: "A"
  explanation_vi: "\"employee turnover\" = tỷ lệ nghỉ việc; hợp với \"replacing and training new staff\". *workforce* (lực lượng lao động) là bẫy nghĩa gần nhưng không nói về \"tỷ lệ rời đi\"."

- id: "exercise-04-p5-09"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 600
  related_word: "wage"
  question: "Unlike the salaried managers, the assembly-line staff are paid an hourly ______."
  options: { A: "salary", B: "bonus", C: "allowance", D: "wage" }
  answer: "D"
  explanation_vi: "nhân viên trả theo giờ → \"hourly **wage**\"; đối lập với \"salaried managers\" (ăn lương cố định). ⚠️ salary (cố định tháng/năm) ≠ wage (theo giờ)."

- id: "exercise-04-p5-10"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 750
  related_word: "lay off"
  question: "To cut costs, the rival firm was forced to ______ nearly a hundred workers last quarter."
  options: { A: "recruit", B: "lay off", C: "promote", D: "reimburse" }
  answer: "B"
  explanation_vi: "\"lay off workers\" = cho thôi việc do cắt giảm chi phí. *recruit* (tuyển), *promote* (thăng chức), *reimburse* (hoàn tiền) trái nghĩa/ngữ cảnh."

- id: "exercise-04-p5-11"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 750
  related_word: "allowance"
  question: "Staff members who travel to the Halston office each month receive a generous travel ______."
  options: { A: "award", B: "invoice", C: "allowance", D: "receipt" }
  answer: "C"
  explanation_vi: "\"travel allowance\" = phụ cấp đi lại. *award* (giải thưởng), *invoice/receipt* (hóa đơn/biên lai) sai nghĩa."

- id: "exercise-04-p5-12"
  part: 5
  topic: "personnel"
  lesson: ["lesson-04"]
  level: 600
  related_word: "benefits"
  question: "A comprehensive ______ package — including health insurance and paid leave — helps the company attract talent."
  options: { A: "benefits", B: "minutes", C: "premises", D: "findings" }
  answer: "A"
  explanation_vi: "\"benefits package\" (bảo hiểm + nghỉ phép) = gói phúc lợi. *minutes/premises/findings* sai loại."

