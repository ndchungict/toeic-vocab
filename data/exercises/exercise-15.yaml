    **MEMO — Procurement Process**
    Team, to keep spending under control, please follow the correct steps. Do not contact suppliers informally; instead, **(13)______** through the system so there is a record. For every confirmed request, the system will issue a **(14)______** with a unique number. Wherever possible, buy **(15)______** rather than in small amounts, since larger quantities earn better prices. Finally, check current **(16)______** levels before ordering, so we don't pay for parts we already have.
  related_word: "place an order"
  options: { A: "take inventory", B: "issue a refund", C: "place an order", D: "submit a bid" }
  answer: "C"
  explanation_vi: "\"place an order through the system\" = đặt hàng. ⚠️ dùng *place*. *take inventory/issue a refund/submit a bid* sai ngữ cảnh."

