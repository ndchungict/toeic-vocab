- id: "exercise-11-p5-01"
  part: 5
  topic: "dining-out"
  lesson: ["lesson-11"]
  level: 600
  related_word: "reservation"
  question: "Ben called *The Harbourline* to make a ______ for a party of four at seven o'clock."
  options: { A: "caterer", B: "reservation", C: "buffet", D: "seating" }
  answer: "B"
  explanation_vi: "\"make a reservation\" = đặt bàn. *caterer/buffet/seating* sai nghĩa. ⚠️ động từ tương ứng là **book** a table."

