<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);">

<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ true }}">
<div style="height:100%;display:flex;flex-direction:column;background:var(--bg);">
  <div style="flex-shrink:0;height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 6px;font-size:13.5px;font-weight:700;color:var(--text);">
    <span>9:41</span>
    <span style="display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:1px;">●●●● <svg width="17" height="12" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="2" width="19" height="12" rx="3"/><rect x="3" y="4" width="13" height="8" rx="1.4" fill="currentColor" stroke="none"/><rect x="21" y="5.5" width="2" height="5" rx="1" fill="currentColor" stroke="none"/></svg></span>
  </div>
  <div style="flex-shrink:0;display:flex;align-items:center;gap:12px;padding:6px 18px 12px;">
    <sc-if value="{{ showBack }}" hint-placeholder-val="{{ false }}"><button onClick="{{ onBack }}" style="width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button></sc-if>
    <div style="flex:1;min-width:0;">
      <div style="font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ title }}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ subtitle }}</div>
    </div>
    <button onClick="{{ onTheme }}" style="width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;">{{ themeIcon }}</button>
  </div>
  <div class="om-noscroll" style="flex:1;overflow-y:auto;overflow-x:hidden;">
    <dc-import name="Screens" app="{{ app }}" layout="mobile" hint-size="378px,560px"></dc-import>
  </div>
  <div style="flex-shrink:0;display:flex;align-items:center;padding:8px 8px 22px;background:var(--surface);border-top:1px solid var(--border);">
    <sc-for list="{{ mTabs }}" as="t" hint-placeholder-count="5"><button onClick="{{ t.onClick }}" style="{{ t.style }}">{{ t.iconEl }}<span>{{ t.label }}</span></button></sc-for>
  </div>
</div>
</sc-if>

<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;display:flex;background:var(--bg);">
  <div style="width:246px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;padding:20px 14px;">
    <div style="display:flex;align-items:center;gap:11px;padding:0 8px 18px;">
      <div style="width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;">V</div>
      <div><div style="font-size:16px;font-weight:800;letter-spacing:-.01em;">VocabTOEIC</div><div style="font-size:11.5px;color:var(--faint);">Tự học từ vựng</div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px;margin-top:6px;">
      <sc-for list="{{ dNav }}" as="n" hint-placeholder-count="6"><button onClick="{{ n.onClick }}" style="{{ n.style }}">{{ n.iconEl }}<span>{{ n.label }}</span></button></sc-for>
    </div>
    <div style="flex:1;"></div>
    <div style="background:var(--primary-soft);border-radius:14px;padding:14px;margin-bottom:12px;">
      <div style="font-size:12.5px;color:var(--muted);font-weight:600;">Mục tiêu hôm nay</div>
      <div style="font-size:15px;font-weight:800;margin-top:2px;color:var(--text);">{{ goalDone }}/{{ goalTotal }} từ</div>
      <div style="margin-top:8px;height:7px;border-radius:7px;background:var(--surface);overflow:hidden;"><div style="{{ goalBar }}"></div></div>
    </div>
    <button onClick="{{ onTheme }}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:600;font-family:'Be Vietnam Pro',sans-serif;">{{ themeIconLg }}<span>{{ themeLabel }}</span></button>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
    <div style="flex-shrink:0;height:66px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:14px;padding:0 26px;">
      <sc-if value="{{ showBack }}" hint-placeholder-val="{{ false }}"><button onClick="{{ onBack }}" style="width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button></sc-if>
      <div style="flex:1;min-width:0;"><div style="font-size:19px;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ title }}</div><div style="font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ subtitle }}</div></div>
      <div style="display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:8px 14px;flex-shrink:0;"><span style="font-size:16px;">🔥</span><span style="font-size:14px;font-weight:800;">{{ streak }}</span><span style="font-size:12.5px;color:var(--muted);font-weight:600;">ngày</span></div>
    </div>
    <div class="om-noscroll" style="flex:1;overflow-y:auto;overflow-x:hidden;">
      <dc-import name="Screens" app="{{ app }}" layout="desktop" hint-size="920px,700px"></dc-import>
    </div>
  </div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:378,&quot;height&quot;:812},&quot;app&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mobile&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;mobile&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  icon(p, sz) {
    return React.createElement('span', { style: { display: 'inline-flex', lineHeight: 0, flexShrink: 0 }, dangerouslySetInnerHTML: { __html: '<svg width="' + (sz || 22) + '" height="' + (sz || 22) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>' } });
  }
  renderVals() {
    const app = this.props.app;
    if (!app || !app.screen) return { isMobile: true, isDesktop: false, mTabs: [], dNav: [] };
    const layout = this.props.layout || 'mobile';
    const isMobile = layout === 'mobile', isDesktop = layout === 'desktop';
    const scr = app.screen;
    const FF = "'Be Vietnam Pro', sans-serif";

    const ICN = {
      home: '<path d="M3 10.7 12 3l9 7.7"/><path d="M5.5 9.6V21h13V9.6"/>',
      vocab: '<path d="M5 4.5h11a1.5 1.5 0 0 1 1.5 1.5v13H6.5A1.5 1.5 0 0 0 5 20.5z"/><path d="M5 20.5A1.5 1.5 0 0 0 6.5 22h11"/>',
      flashcard: '<rect x="3" y="8" width="13.5" height="11.5" rx="2.3"/><path d="M7 5.2h10.3A1.7 1.7 0 0 1 19 6.9v9.4"/>',
      stories: '<path d="M12 6.6C10.4 5.1 7.8 4.6 4 4.9V19c3.8-.3 6.4.2 8 1.6 1.6-1.4 4.2-1.9 8-1.6V4.9c-3.8-.3-6.4.2-8 1.7z"/><path d="M12 6.6V20.6"/>',
      exercise: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.4 12.2 2.4 2.4 4.8-5"/>',
      progress: '<path d="M4.5 20V13"/><path d="M12 20V5"/><path d="M19.5 20v-9"/>'
    };
    const alias = { detail: 'vocab', reader: 'stories', result: 'exercise' };
    const activeKey = alias[scr] || scr;
    const w = app.selectedWord || {}, sto = app.selectedStory || {};
    const titles = { home: 'Trang chủ', vocab: 'Từ vựng', detail: w.word, flashcard: 'Flashcard', stories: 'Truyện chêm', reader: sto.title, exercise: 'Bài tập TOEIC', result: 'Kết quả bài tập', progress: 'Tiến độ học' };
    const subs = {
      home: 'Cùng học từ mới hôm nay nhé!', vocab: app.filtered.length + ' từ · tìm & lọc',
      detail: (app.posLabel[w.pos] || '') + (w.ipa ? ' · ' + w.ipa : ''), flashcard: 'Ôn tập lặp lại ngắt quãng',
      stories: 'Học từ qua ngữ cảnh', reader: (sto.newWords || []).length + ' từ mới trong truyện',
      exercise: 'Part 5 · 6 · 7 · điền từ đang học', result: 'Xem lại từng câu kèm giải thích', progress: 'Theo dõi hành trình của bạn'
    };
    const backSet = { detail: 1, reader: 1, exercise: 1, result: 1 };

    const mkNav = (k, label, mobile) => {
      const on = activeKey === k;
      return {
        label, onClick: () => app.go(k), iconEl: this.icon(ICN[k], mobile ? 21 : 20),
        style: mobile ? {
          flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '3px', padding: '4px 2px',
          border: 'none', background: 'transparent', cursor: 'pointer', color: on ? 'var(--primary)' : 'var(--faint)',
          fontSize: '10px', fontWeight: 600, fontFamily: FF
        } : {
          display: 'flex', alignItems: 'center', gap: '12px', padding: '11px 13px', borderRadius: '11px', border: 'none',
          cursor: 'pointer', width: '100%', textAlign: 'left', fontSize: '14.5px', fontWeight: 600, fontFamily: FF,
          background: on ? 'var(--primary-soft)' : 'transparent', color: on ? 'var(--primary)' : 'var(--muted)'
        }
      };
    };
    const mTabs = [['home', 'Trang chủ'], ['vocab', 'Từ vựng'], ['flashcard', 'Thẻ'], ['stories', 'Truyện'], ['progress', 'Tiến độ']].map(([k, l]) => mkNav(k, l, true));
    const dNav = [['home', 'Trang chủ'], ['vocab', 'Từ vựng'], ['flashcard', 'Flashcard'], ['stories', 'Truyện chêm'], ['exercise', 'Bài tập'], ['progress', 'Tiến độ']].map(([k, l]) => mkNav(k, l, false));

    return {
      app, isMobile, isDesktop, mTabs, dNav,
      title: titles[scr] || '', subtitle: subs[scr] || '',
      showBack: !!backSet[scr], onBack: app.back, onTheme: app.toggleTheme,
      themeIcon: app.theme === 'dark' ? '☀︎' : '☾',
      themeIconLg: this.icon(app.theme === 'dark' ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>' : '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>', 18),
      themeLabel: app.theme === 'dark' ? 'Chế độ sáng' : 'Chế độ tối',
      streak: app.stats.streak, goalDone: app.stats.todayDone, goalTotal: app.stats.todayGoal,
      goalBar: { height: '100%', width: Math.round(app.stats.todayDone / app.stats.todayGoal * 100) + '%', background: 'var(--primary)', borderRadius: '7px', transition: 'width .4s' }
    };
  }
}
</script>
</body>
</html>
