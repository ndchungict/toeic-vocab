  flattenExam() {
    const out = [];
    this.DATA.exam.parts.forEach(p => {
      if (p.kind === 'sentences') p.questions.forEach(q => out.push(q));
      else p.passages.forEach(ps => ps.questions.forEach(q => out.push(q)));
    });
    return out;
  }

  componentDidMount() {
    try {
      const raw = localStorage.getItem('toeic:v2');
      if (raw) {
        const s = JSON.parse(raw);
        this.setState({
          theme: s.theme || 'light', masteredIds: s.masteredIds || this.state.masteredIds,
          favIds: s.favIds || this.state.favIds, readIds: s.readIds || [], srs: s.srs || {}
        });
      }
    } catch (e) {}
    if (!this.state.flash.ids.length) this.buildFlash();
  }

  persist() {
    try { localStorage.setItem('toeic:v2', JSON.stringify({ theme: this.state.theme, masteredIds: this.state.masteredIds, favIds: this.state.favIds, readIds: this.state.readIds, srs: this.state.srs })); } catch (e) {}
  }

  buildFlash = () => {
    const ids = this.DATA.vocab.map(v => v.word).sort(() => Math.random() - 0.5).slice(0, 8);
    this.setState({ flash: { ids, i: 0, revealed: false, done: false, stats: { again: 0, hard: 0, good: 0, easy: 0 } } });
  };

  go = (screen) => {
    if (screen === 'result' && !this.state.ex.submitted) this.seedResult();
    else this.setState({ screen });
  };
  back = () => { const map = { detail: 'vocab', reader: 'stories', exercise: 'home', result: 'exercise' }; this.setState(s => ({ screen: map[s.screen] || 'home', popWord: null })); };
  openWord = (id) => this.setState({ selWord: id, screen: 'detail', popWord: null });
  openStory = (id) => { const st = this.DATA.stories.find(s => s.id === id); if (st && st.coming) return; this.setState({ selStory: id, screen: 'reader', readerMode: 'chem' }); this.markRead(id); };
  setPop = (id) => this.setState({ popWord: id });

  toggleIn(list, id) { return list.includes(id) ? list.filter(x => x !== id) : list.concat(id); }
  toggleMastered = (id) => this.setState(s => ({ masteredIds: this.toggleIn(s.masteredIds, id) }), () => this.persist());
  toggleFavorite = (id) => this.setState(s => ({ favIds: this.toggleIn(s.favIds, id) }), () => this.persist());
  markRead = (id) => this.setState(s => ({ readIds: s.readIds.includes(id) ? s.readIds : s.readIds.concat(id) }), () => this.persist());

  setFilter = (k, v) => this.setState(s => ({ filters: Object.assign({}, s.filters, { [k]: v }) }));
  clearFilters = () => this.setState({ filters: { q: '', topic: 'all', level: 'all', lesson: 'all', pos: 'all' } });

  setLight = () => this.setState({ theme: 'light' }, () => this.persist());
  setDark = () => this.setState({ theme: 'dark' }, () => this.persist());
  toggleTheme = () => this.setState(s => ({ theme: s.theme === 'light' ? 'dark' : 'light' }), () => this.persist());

  speak = (text, lang) => {
    try { if (!window.speechSynthesis) return; const u = new SpeechSynthesisUtterance((text || '').replace(/[{}]/g, '')); u.lang = lang || 'en-US'; u.rate = 0.9; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch (e) {}
  };

  flashReveal = () => this.setState(s => ({ flash: Object.assign({}, s.flash, { revealed: true }) }));
  flashRate = (q) => this.setState(s => {
    const f = s.flash, id = f.ids[f.i], box = (s.srs[id] && s.srs[id].box) || 0;
    const nb = q === 'again' ? 0 : q === 'hard' ? Math.max(1, box) : q === 'good' ? box + 1 : box + 2;
    const srs = Object.assign({}, s.srs, { [id]: { box: nb, seen: ((s.srs[id] && s.srs[id].seen) || 0) + 1 } });
    let mastered = s.masteredIds;
    if ((q === 'good' || q === 'easy') && nb >= 3 && !mastered.includes(id)) mastered = mastered.concat(id);
    const stats = Object.assign({}, f.stats); stats[q] = (stats[q] || 0) + 1;
    const ni = f.i + 1;
    return { srs, masteredIds: mastered, flash: Object.assign({}, f, { i: ni, revealed: false, done: ni >= f.ids.length, stats }) };
  }, () => this.persist());
  flashRestart = () => this.buildFlash();

  examPick = (qid, k) => this.setState(s => s.ex.submitted ? null : ({ ex: Object.assign({}, s.ex, { answers: Object.assign({}, s.ex.answers, { [qid]: k }) }) }));
  examSubmit = () => this.setState(s => ({ ex: Object.assign({}, s.ex, { submitted: true }), screen: 'result' }));
  examReset = () => this.setState({ ex: { answers: {}, submitted: false }, screen: 'exercise' });
  seedResult = () => { const ans = {}; this.flattenExam().forEach((q, i) => { const opts = Object.keys(q.options); ans[q.id] = (i % 5 === 3) ? opts.find(o => o !== q.answer) : q.answer; }); this.setState({ ex: { answers: ans, submitted: true }, screen: 'result' }); };

  setReaderMode = (m) => this.setState({ readerMode: m });
  toggleTranslation = () => this.setState(s => ({ translationOn: !s.translationOn }));

  renderVals() {
    const st = this.state, D = this.DATA;
    const mastered = new Set(st.masteredIds), fav = new Set(st.favIds), read = new Set(st.readIds);
    const f = st.filters;
    const filtered = D.vocab.filter(v => {
      if (f.q && !(v.word.toLowerCase().includes(f.q.toLowerCase()) || v.meaning.toLowerCase().includes(f.q.toLowerCase()))) return false;
      if (f.topic !== 'all' && v.topic !== f.topic) return false;
      if (f.level !== 'all' && String(v.level) !== String(f.level)) return false;
      if (f.lesson !== 'all' && !v.lesson.includes(f.lesson)) return false;
      if (f.pos !== 'all' && v.pos !== f.pos) return false;
      return true;
    });
    const lessons = Array.from(new Set(D.vocab.flatMap(v => v.lesson))).sort();
    const topics = Array.from(new Set(D.vocab.map(v => v.topic)));
    const poss = Array.from(new Set(D.vocab.map(v => v.pos)));

    const flash = st.flash;
    const flashCard = D.vocab.find(v => v.word === flash.ids[flash.i]) || null;
    const flatQ = this.flattenExam();
    let exScore = 0; flatQ.forEach(q => { if (st.ex.answers[q.id] === q.answer) exScore++; });

    const byLevel = [450, 600, 750, 860, 900].map(l => { const words = D.vocab.filter(v => v.level === l); return { level: l, total: words.length, done: words.filter(v => mastered.has(v.word)).length }; });
    const byTopic = topics.map(t => { const words = D.vocab.filter(v => v.topic === t); return { topic: t, label: D.topicLabel[t], total: words.length, done: words.filter(v => mastered.has(v.word)).length }; });
    const series = [{ d: 'T2', v: 3 }, { d: 'T3', v: 5 }, { d: 'T4', v: 2 }, { d: 'T5', v: 6 }, { d: 'T6', v: 4 }, { d: 'T7', v: 7 }, { d: 'CN', v: Math.max(2, mastered.size) }];

    const app = {
      theme: st.theme, screen: st.screen, posLabel: D.posLabel, topicLabel: D.topicLabel,
      vocab: D.vocab, filtered, filters: f, lessons, topics, poss, levels: [450, 600, 750, 860, 900],
      selectedWord: D.vocab.find(v => v.word === st.selWord) || D.vocab[0],
      stories: D.stories, selectedStory: D.stories.find(s => s.id === st.selStory) || D.stories[0],
      readerMode: st.readerMode, exam: D.exam, exAnswers: st.ex.answers, exSubmitted: st.ex.submitted,
      mastered, fav, read,
      popWord: st.popWord ? D.vocab.find(v => v.word === st.popWord) : null,
      translationOn: st.translationOn,
      stats: { masteredCount: mastered.size, total: D.vocab.length, favCount: fav.size, streak: 5, todayGoal: 12, todayDone: Math.min(12, 4 + flash.stats.good + flash.stats.easy), pct: Math.round(mastered.size / D.vocab.length * 100) },
      flash: { card: flashCard, i: flash.i, total: flash.ids.length, revealed: flash.revealed, done: flash.done, stats: flash.stats },
      ex: { total: flatQ.length, answeredCount: Object.keys(st.ex.answers).length, score: exScore, submitted: st.ex.submitted },
      dash: { byLevel, byTopic, series },
      go: this.go, back: this.back, openWord: this.openWord, openStory: this.openStory, setPop: this.setPop,
      toggleMastered: this.toggleMastered, toggleFavorite: this.toggleFavorite,
      isMastered: (id) => mastered.has(id), isFav: (id) => fav.has(id), isRead: (id) => read.has(id),
      setFilter: this.setFilter, clearFilters: this.clearFilters, speak: this.speak, toggleTheme: this.toggleTheme,
      flashReveal: this.flashReveal, flashRate: this.flashRate, flashRestart: this.flashRestart,
      examPick: this.examPick, examSubmit: this.examSubmit, examReset: this.examReset,
      setReaderMode: this.setReaderMode, toggleTranslation: this.toggleTranslation
    };

    const chipList = [['home', 'Trang chủ'], ['vocab', 'Từ vựng'], ['detail', 'Chi tiết từ'], ['flashcard', 'Flashcard'], ['stories', 'Truyện chêm'], ['reader', 'Trình đọc'], ['exercise', 'Bài tập'], ['result', 'Kết quả'], ['progress', 'Tiến độ']];
    const chips = chipList.map(([k, label]) => ({
      label, onClick: () => this.go(k),
      style: { padding: '8px 15px', borderRadius: '10px', fontSize: '13.5px', fontWeight: 600, cursor: 'pointer', border: '1px solid ' + (st.screen === k ? 'transparent' : 'var(--border)'), background: st.screen === k ? 'var(--primary)' : 'var(--surface)', color: st.screen === k ? '#fff' : 'var(--muted)', fontFamily: "'Be Vietnam Pro', sans-serif", boxShadow: st.screen === k ? '0 6px 16px -6px var(--ring)' : 'none', transition: 'all .15s ease' }
    }));
    const seg = (on) => ({ padding: '7px 15px', borderRadius: '9px', fontSize: '13px', fontWeight: 600, cursor: 'pointer', border: 'none', background: on ? 'var(--surface)' : 'transparent', color: on ? 'var(--text)' : 'var(--muted)', boxShadow: on ? '0 2px 8px -3px rgba(0,0,0,.2)' : 'none', fontFamily: "'Be Vietnam Pro', sans-serif" });

    const L = { '--studio': '#e8eaf3', '--bg': '#f6f7fb', '--surface': '#ffffff', '--surface-2': '#eef0f6', '--elev': '#ffffff', '--border': '#e6e8f0', '--border-strong': '#d5d8e4', '--text': '#1a1d27', '--muted': '#6b7186', '--faint': '#9aa0b2', '--primary': '#5b52e8', '--primary-soft': '#eceafe', '--ring': 'rgba(91,82,232,.4)' };
    const Dk = { '--studio': '#080910', '--bg': '#0f1118', '--surface': '#171a24', '--surface-2': '#1c2029', '--elev': '#1f232f', '--border': '#282d3a', '--border-strong': '#39404f', '--text': '#e9ebf4', '--muted': '#98a0b4', '--faint': '#6b7386', '--primary': '#8b83ff', '--primary-soft': 'rgba(139,131,255,.16)', '--ring': 'rgba(139,131,255,.45)' };

    return { app, chips, themeVars: st.theme === 'dark' ? Dk : L, setLight: this.setLight, setDark: this.setDark, lightBtn: seg(st.theme === 'light'), darkBtn: seg(st.theme === 'dark') };
  }
}
</script>
