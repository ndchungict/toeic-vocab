baseURL                = "https://ndchungict.github.io/toeic-vocab/"
locale                 = "vi-VN"
defaultContentLanguage = "vi"
title                  = "VocabTOEIC — Tự học từ vựng"
enableRobotsTXT        = true
enableGitInfo          = true
hasCJKLanguage         = false
timeZone               = "Asia/Ho_Chi_Minh"

# data/slugs/*.md và data/story/**/*.md giữ lại làm tài liệu người đọc + nguồn
# gốc cho scripts/tokenize_stories.py (§10, §12.3 Q8), nhưng Hugo nạp TOÀN BỘ
# data/ vào site.Data ngay khi có template tham chiếu site.Data.* — và .md
# không phải định dạng data hợp lệ nên build lỗi cứng nếu không loại trừ.
# Đường dẫn match là tương đối so với data/ (không có tiền tố "data/").
ignoreFiles = ['slugs/', 'story/']

[taxonomies]
  topic    = "topics"
  subtopic = "subtopics"
  act      = "acts"

[markup.goldmark.renderer]
  unsafe = true            # BẮT BUỘC: passage Part 6/7 và truyện có HTML inline
[markup.tableOfContents]
  startLevel = 2
  endLevel   = 3

[params]
  description    = "558 từ vựng TOEIC theo 13 chủ đề, học qua truyện dài 28 chương \"Project Aria\"."
  totalEntries   = 558      # số THẺ TỪ — đây là con số màn Vocab hiển thị ("N từ")
  uniqueWords    = 537      # 558 − 21 (20 từ trùng, riêng "coverage" xuất hiện 3 lần)
  totalLessons   = 28
  totalTopics    = 13
  totalSubtopics = 29     # đo lại từ data/words thật; §2.2 plan ghi 30 là lệch 1 (build_taxonomy.py xác nhận 29)
  totalExercises = 704
  storyTitle     = "Project Aria"
  flashSessionSize = 8      # khớp mockup
  dailyGoal        = 12     # khớp mockup
  streak           = 5      # GIỮ TĨNH như mockup (chốt lại ở M8, khác đề xuất "làm thật" ban đầu của §12.3 Q4)
  todayDone        = 4      # khớp giá trị nền của mockup (mockup cộng thêm +good+easy trong phiên React — không áp dụng cho site nhiều trang tĩnh)
  # màu/typography khai báo DUY NHẤT ở _tokens.scss, không lặp ở đây

[menu]
  # khớp sidebar desktop của mockup (6 mục), mobile lấy 5 mục đầu trừ "Bài tập"
  [[menu.main]]
    name    = "Trang chủ"
    pageRef = "/"
    weight  = 10
    [menu.main.params]
      icon = "home"
  [[menu.main]]
    name    = "Từ vựng"
    pageRef = "/words"
    weight  = 20
    [menu.main.params]
      icon = "vocab"
  [[menu.main]]
    name    = "Flashcard"
    pageRef = "/flashcard"
    weight  = 30
    [menu.main.params]
      icon = "flashcard"
  [[menu.main]]
    name    = "Truyện chêm"
    pageRef = "/lessons"
    weight  = 40
    [menu.main.params]
      icon = "stories"
  [[menu.main]]
    name    = "Bài tập"
    pageRef = "/exercises"        # trang danh sách 28 đề
    weight  = 50
    [menu.main.params]
      icon        = "exercise"
      desktopOnly = true
  [[menu.main]]
    name    = "Tiến độ"
    pageRef = "/progress"
    weight  = 60
    [menu.main.params]
      icon = "progress"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]

[outputFormats.WordsJSON]
  mediaType = "application/json"
  baseName  = "index"
  isPlainText = true

[minify]
  disableXML = true
